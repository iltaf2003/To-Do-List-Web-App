<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>To-Do List</h1>
            <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
        </header>
        
        <section class="input-section">
            <input type="text" id="task-input" placeholder="Add a new task..." maxlength="100">
            <button id="add-task-btn">Add Task</button>
        </section>
        
        <section class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text">
                <span id="total-tasks">0</span> total, 
                <span id="completed-tasks">0</span> completed, 
                <span id="remaining-tasks">0</span> remaining
            </div>
        </section>
        
        <section class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button id="clear-completed">Clear Completed</button>
        </section>
        
        <section class="task-list" id="task-list">
            <!-- Tasks will be dynamically added here -->
        </section>
        
        <div class="empty-state" id="empty-state">
            <p>No tasks yet. Add one above!</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
